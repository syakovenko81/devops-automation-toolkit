[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-automation-toolkit"
version = "0.1.0"
description = "A small reusable HTTP and HTTPS resource checker"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
