name: Test coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest
          --cov=src/devops_toolkit
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=95

      - name: Add coverage summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f coverage.xml ]]; then
            {
              echo "## Test coverage"
              echo "Coverage report was not generated because the test command did not complete."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as element_tree

          root = element_tree.parse("coverage.xml").getroot()
          line_rate = float(root.attrib["line-rate"]) * 100
          lines_covered = root.attrib["lines-covered"]
          lines_valid = root.attrib["lines-valid"]

          print("## Test coverage")
          print("")
          print("| Metric | Result |")
          print("| --- | ---: |")
          print(f"| Line coverage | **{line_rate:.2f}%** |")
          print(f"| Covered lines | {lines_covered}/{lines_valid} |")
          print("| Required threshold | 95% |")
          PY
