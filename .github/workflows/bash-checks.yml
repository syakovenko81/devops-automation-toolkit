name: Bash resource checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-resources:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run resource checks from Bash
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=src

          run_check() {
            local expected_exit_code="$1"
            shift

            set +e
            python -m devops_toolkit.checker "$@"
            local actual_exit_code="$?"
            set -e

            if [[ "$actual_exit_code" -ne "$expected_exit_code" ]]; then
              echo "Expected exit code $expected_exit_code, got $actual_exit_code"
              return 1
            fi
          }

          run_check 0 "https://example.com"
          run_check 0 "https://httpbin.org/status/200"
          run_check 0 "https://httpbin.org/status/201"
          run_check 0 "https://httpbin.org/status/204"
          run_check 1 "https://httpbin.org/status/400"
          run_check 1 "https://httpbin.org/status/404"
          run_check 1 "https://httpbin.org/status/500"
          run_check 2 "example.com"
          run_check 2 "ftp://example.com"
          run_check 2 "http://"
          run_check 2 "https://example.com" --timeout 0
          run_check 2 "https://does-not-exist.invalid"
          run_check 2 "http://127.0.0.1:1"
          run_check 2 "https://expired.badssl.com"
          run_check 2 "https://httpbin.org/delay/10" --timeout 0.1
